name: Continuous Integration

on:
  push:
    branches:
      - master
      - main
      - next
      - beta
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    name: Test on node ${{ matrix.node }}
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - name: Install dependencies and test
        run: |
          vp install --frozen-lockfile
          vp run build
          vp run test

  publish:
    name: Publish package to NPM
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    if: github.actor != 'github-actions[bot]' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' || github.ref == 'refs/heads/beta')
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: 24
          cache: true
      - name: Build and release
        run: |
          vp install --frozen-lockfile
          vp run build
          vp run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
